# defaults for roles/mycache — the values live in the mirror: inventories/<env>/myworkspace/<the file's path>.yml
# mycache's config files, as paths below ~/myworkspace — a new file = one line here + its mirrored values
# (inventories/<env>/myworkspace/<path>.yml) + its template (templates/myworkspace/<path>.j2)
mycache_files:
  - projectspace/platform/mycache/.env
  - projectspace/platform/mycache/cache-agent/agent.conf
