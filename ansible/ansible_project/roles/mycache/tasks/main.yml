# roles/mycache — mycache's config files, each rendered from its mirror (the single source of truth):
#   values   inventories/<env>/myworkspace/<path>.yml
#   template templates/myworkspace/<path>.j2
#   target   <workspace_root>/<path>          (keeps its place, owner and mode; mycache still starts alone from it)
- name: "mycache {{ item }}"
  ansible.builtin.include_tasks: render_mirrored_file.yml
  loop: "{{ mycache_files }}"
