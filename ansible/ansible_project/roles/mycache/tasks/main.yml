# roles/mycache — mycache's two config files, rendered from group_vars/mycache/ (the single source of truth).
# The files keep their place, owner and mode; mycache still starts alone from them, without Ansible.
- name: mycache .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ mycache_dir }}/.env"

- name: mycache cache-agent/agent.conf
  ansible.builtin.template:
    src: agent.conf.j2
    dest: "{{ mycache_dir }}/cache-agent/agent.conf"
