# roles/mydocs/meta — what mydocs needs BEFORE it (CONFMGT [7.5]): Ansible runs these roles first, each ONCE per play
# (config + start), so playbooks/mydocs.yml deploys mydocs with what it needs.
# Only HARD needs (it cannot start without them) — logs to mylog_analytics or links are not dependencies.
dependencies:
  - role: shared                # inventories/<env>/shared/ — values 2+ projects use
  - role: kms
  - role: mypostgresql_db
  - role: mycache
  - role: mychannels
