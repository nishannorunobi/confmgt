# roles/workspace/meta — what workspace needs BEFORE it (CONFMGT [7.5]): Ansible runs these roles first, each ONCE per play
# (config + start), so playbooks/workspace.yml deploys workspace alone.
# Only HARD needs (it cannot start without them) — logs to mylog_analytics or links are not dependencies.
dependencies:
  - role: shared                # inventories/<env>/shared/ — values 2+ projects use
