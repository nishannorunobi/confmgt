# restart mylog_analytics with its OWN scripts (three-layer rule) — the same steps the workspace uses. Runs ONLY when a file
# really changed (never in a dry run).
- name: restart mylog_analytics
  ansible.builtin.shell: |
    set -e
    bash stop.sh
    SVC_RUN=1 bash start.sh
  args:
    chdir: "{{ workspace_root }}/projectspace/mylog_analytics"
    executable: /bin/bash
