# roles/kms — its config files, each rendered from its mirror + shared/ (the single source of truth)
- name: "kms — its config files from the mirror"
  ansible.builtin.include_tasks: render_mirrored_file.yml
  loop: "{{ kms_files }}"
  loop_control:
    label: "{{ item }}"

- name: "kms — up (its targets in projects.yml; none → config only)"
  ansible.builtin.include_role:
    name: start_project
  vars:
    start_project_name: kms
