# restart myodoo with its OWN scripts (three-layer rule) — the same steps the workspace uses. Runs ONLY when a file
# really changed (never in a dry run).
- name: restart myodoo
  ansible.builtin.shell: |
    set -e
    bash stop.sh --19
    SVC_RUN=1 bash start.sh --19
  args:
    chdir: "{{ workspace_root }}/projectspace/myodoo"
    executable: /bin/bash
