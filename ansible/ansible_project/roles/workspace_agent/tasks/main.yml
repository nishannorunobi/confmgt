# roles/workspace_agent — its config files, each rendered from its mirror + shared/ (the single source of truth)
- name: "workspace_agent — its config files from the mirror"
  ansible.builtin.include_tasks: render_mirrored_file.yml
  loop: "{{ workspace_agent_files }}"
  loop_control:
    label: "{{ item }}"

- name: "workspace_agent — up (its targets in projects.yml; none → config only)"
  ansible.builtin.include_role:
    name: start_project
  vars:
    start_project_name: workspace_agent
