# roles/agents — its config files, each rendered from its mirror + shared/ (the single source of truth)
- name: "agents — its config files from the mirror"
  ansible.builtin.include_tasks: render_mirrored_file.yml
  loop: "{{ agents_files }}"
  loop_control:
    label: "{{ item }}"

- name: "agents — up (its targets in projects.yml; none → config only)"
  ansible.builtin.include_role:
    name: start_project
  vars:
    start_project_name: agents
