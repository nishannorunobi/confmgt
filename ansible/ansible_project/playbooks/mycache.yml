# mycache.yml — mycache's configuration from the single source of truth (CONFMGT epic [3]).
# Story 3.1 = CHECK ONLY: run it with check_playbook.sh (dry run) — it shows every line that differs and writes nothing.
# Writing (apply) comes with story 3.2; until then apply_playbook.sh stops here with one clear line.
- name: mycache configuration
  hosts: mycache
  gather_facts: false
  pre_tasks:
    - name: Check only (story 3.1)
      ansible.builtin.assert:
        that: ansible_check_mode
        fail_msg: "mycache.yml is check-only until story 3.2 — use check_playbook.sh (dry run)"
        quiet: true
  roles:
    - mycache
