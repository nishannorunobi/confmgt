# mycache.yml — mycache's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → mycache   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → mycache   writes the changed files, then restarts mycache with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: mycache configuration
  hosts: mycache
  gather_facts: false
  roles:
    - mycache
