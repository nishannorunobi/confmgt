# kms.yml — kms's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → kms   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → kms   writes the changed files, then restarts kms with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: kms configuration
  hosts: kms
  gather_facts: false
  roles:
    - shared                    # inventories/<env>/shared/ first: values used by 2+ projects
    - kms
