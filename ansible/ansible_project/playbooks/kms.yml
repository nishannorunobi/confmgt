# kms.yml — deploy kms as ONE block (CONFMGT epic [3] config · [7.5] start + dependencies):
#   what it needs first (roles/kms/meta/main.yml) → its config from the single source of truth (restart only if changed)
#   → its targets up (projects.yml; none → config only). Each role ONCE, already running → left alone. Again → changed=0.
#   check_playbook.sh → kms   dry run: every line that differs — writes nothing, restarts nothing, starts nothing
#   apply_playbook.sh → kms   the same, for real
- name: kms — deploy (what it needs first)
  hosts: kms
  gather_facts: false
  roles:
    - kms                       # + what it needs first: roles/kms/meta/main.yml (CONFMGT [7.5])
