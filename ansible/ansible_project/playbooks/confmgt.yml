# confmgt.yml — confmgt's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → confmgt   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → confmgt   writes the changed files, then restarts confmgt with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: confmgt configuration
  hosts: confmgt
  gather_facts: false
  roles:
    - shared                    # inventories/<env>/shared/ first: values used by 2+ projects
    - confmgt
