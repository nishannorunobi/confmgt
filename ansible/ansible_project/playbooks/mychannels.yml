# mychannels.yml — mychannels's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → mychannels   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → mychannels   writes the changed files, then restarts mychannels with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: mychannels configuration
  hosts: mychannels
  gather_facts: false
  roles:
    - shared                    # inventories/<env>/shared/ first: values used by 2+ projects
    - mychannels
