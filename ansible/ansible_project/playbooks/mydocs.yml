# mydocs.yml — deploy mydocs as ONE block (CONFMGT epic [3] config · [7.5] start + dependencies):
#   what it needs first (roles/mydocs/meta/main.yml) → its config from the single source of truth (restart only if changed)
#   → its targets up (projects.yml; none → config only). Each role ONCE, already running → left alone. Again → changed=0.
#   check_playbook.sh → mydocs   dry run: every line that differs — writes nothing, restarts nothing, starts nothing
#   apply_playbook.sh → mydocs   the same, for real
- name: mydocs — deploy (what it needs first)
  hosts: mydocs
  gather_facts: false
  roles:
    - mydocs                       # + what it needs first: roles/mydocs/meta/main.yml (CONFMGT [7.5])
