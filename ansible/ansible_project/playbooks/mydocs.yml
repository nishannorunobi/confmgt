# mydocs.yml — mydocs's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → mydocs   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → mydocs   writes the changed files, then restarts mydocs with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: mydocs configuration
  hosts: mydocs
  gather_facts: false
  roles:
    - shared                    # inventories/<env>/shared/ first: values used by 2+ projects
    - mydocs
