# mylog_analytics.yml — mylog_analytics's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → mylog_analytics   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → mylog_analytics   writes the changed files, then restarts mylog_analytics with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: mylog_analytics configuration
  hosts: mylog_analytics
  gather_facts: false
  roles:
    - shared                    # inventories/<env>/shared/ first: values used by 2+ projects
    - mylog_analytics
