# mylog_analytics.yml — deploy mylog_analytics as ONE block (CONFMGT epic [3] config · [7.5] start + dependencies):
#   what it needs first (roles/mylog_analytics/meta/main.yml) → its config from the single source of truth (restart only if changed)
#   → its targets up (projects.yml; none → config only). Each role ONCE, already running → left alone. Again → changed=0.
#   check_playbook.sh → mylog_analytics   dry run: every line that differs — writes nothing, restarts nothing, starts nothing
#   apply_playbook.sh → mylog_analytics   the same, for real
- name: mylog_analytics — deploy (what it needs first)
  hosts: mylog_analytics
  gather_facts: false
  roles:
    - mylog_analytics                       # + what it needs first: roles/mylog_analytics/meta/main.yml (CONFMGT [7.5])
