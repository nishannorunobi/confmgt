# agents.yml — deploy agents as ONE block (CONFMGT epic [3] config · [7.5] start + dependencies):
#   what it needs first (roles/agents/meta/main.yml) → its config from the single source of truth (restart only if changed)
#   → its targets up (projects.yml; none → config only). Each role ONCE, already running → left alone. Again → changed=0.
#   check_playbook.sh → agents   dry run: every line that differs — writes nothing, restarts nothing, starts nothing
#   apply_playbook.sh → agents   the same, for real
- name: agents — deploy (what it needs first)
  hosts: agents
  gather_facts: false
  roles:
    - agents                       # + what it needs first: roles/agents/meta/main.yml (CONFMGT [7.5])
