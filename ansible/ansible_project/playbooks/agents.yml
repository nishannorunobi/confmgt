# agents.yml — agents's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → agents   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → agents   writes the changed files, then restarts agents with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: agents configuration
  hosts: agents
  gather_facts: false
  roles:
    - shared                    # inventories/<env>/shared/ first: values used by 2+ projects
    - agents
