# deploy.yml — the workspace on the deploy_targets machines of an inventory (CONFMGT [6]): dev = this PC, test = the test VM.
#   check_playbook.sh → deploy → <env>   dry run — changes nothing
#   apply_playbook.sh → deploy → <env>   [ws_manage_git] git → clone / pull ws_branch + the deploy=yes repos of the workspace's ccc/scripts/gitmgt/repos.conf · [ws_manage_docker] Docker by the
#                                         workspace's OWN script · [ws_kms_setup] kms unattended + keys + sign-ups
#                                         · the workspace is there · each project of
#                                         deploy_projects: config → restart if changed → up. Run again → changed=0.
# How, per environment (a switch not set → off): inventories/<env>/group_vars/deploy_targets/ — dev: git + Docker OFF (your live checkout; Docker
# from ccc/startup.sh) · test: both ON (ws_branch: a run may send its own — the story branch under test).
# deploy_projects (dev): inventories/dev/group_vars/deploy_targets/projects.yml — one project per story ([6.4]…).
- name: Deploy the workspace
  hosts: deploy_targets
  gather_facts: false
  tasks:
    - name: the base packages (ws_base_packages — only when missing)
      when: ws_base_packages | default([]) | length > 0
      become: true
      ansible.builtin.apt:
        name: "{{ ws_base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: GitHub answers with this machine's key
      ansible.builtin.command: ssh -T -o BatchMode=yes -o StrictHostKeyChecking=accept-new git@github.com
      when: ws_manage_git | default(false) | bool
      register: github
      changed_when: false
      failed_when: "'successfully authenticated' not in github.stderr"
      check_mode: false

    - name: the workspace — clone, or pull (local changes in the machine → refused, never thrown away)
      when: ws_manage_git | default(false) | bool
      ansible.builtin.git:
        repo: "{{ ws_repo }}"
        dest: "{{ ws_dir }}"
        version: "{{ ws_branch }}"
        update: true
        force: false
        accept_hostkey: true

    - name: the branch of each project repo — ws_repo_branches "path=branch,…" (05_deploy_test_vm.sh sends the PC's)
      when: ws_manage_git | default(false) | bool
      ansible.builtin.set_fact:
        repo_branch: "{{ dict((ws_repo_branches | default('')).split(',') | select | map('split', '=')) }}"

    - name: THE repo list — ccc/scripts/gitmgt/repos.conf from this machine's own myworkspace clone (CLAUDEWORK-258)
      when: ws_manage_git | default(false) | bool
      ansible.builtin.slurp:
        src: "{{ ws_dir }}/ccc/scripts/gitmgt/repos.conf"
      register: repos_conf

    - name: the project repos to deploy — every "folder | repo | yes" line of repos.conf (not myworkspace itself)
      when: ws_manage_git | default(false) | bool
      ansible.builtin.set_fact:
        ws_project_repos: >-
          {%- set out = [] -%}
          {%- for l in (repos_conf.content | b64decode).splitlines() -%}
            {%- set f = l.split('|') | map('trim') | list -%}
            {%- if f | length >= 3 and f[0] and not f[0].startswith('#') and f[0] != '.' and f[2] == 'yes' -%}
              {%- set _ = out.append({'path': f[0], 'repo': f[1]}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: the project repos — clone, or pull (local changes in the machine → refused, never thrown away)
      when: ws_manage_git | default(false) | bool
      ansible.builtin.git:
        repo: "{{ project_repo.repo }}"
        dest: "{{ ws_dir }}/{{ project_repo.path }}"
        version: "{{ repo_branch[project_repo.path] | default(project_repo.branch | default('main')) }}"
        update: true
        force: false
        accept_hostkey: true
      loop: "{{ ws_project_repos | default([]) }}"
      loop_control:
        loop_var: project_repo
        label: "{{ project_repo.path }}"

    - name: Docker — the workspace's own iam_cloud_machine/docker/install_docker.sh (installs only when missing)
      when: ws_manage_docker | default(false) | bool
      ansible.builtin.command: bash {{ ws_dir }}/iam_cloud_machine/docker/install_docker.sh
      register: docker
      changed_when: "'Installing' in docker.stdout"

    - name: the workspace's runtime folder mountspace/ (its scripts find the workspace by it; never in git)
      when: ws_manage_git | default(false) | bool
      ansible.builtin.file:
        path: "{{ ws_dir }}/mountspace"
        state: directory
        mode: "0755"

    - name: the shared Docker network — the workspace's own iam_cloud_machine/network/docker_network.sh
      when: ws_manage_docker | default(false) | bool
      ansible.builtin.command: bash iam_cloud_machine/network/docker_network.sh
      args:
        chdir: "{{ ws_dir }}"
      register: net
      changed_when: "'Created network' in net.stdout"

    # [ws_kms_setup] the machine's OWN kms, unattended — a test machine only (kms refuses anywhere else; CONFMGT [6.17])
    - name: kms — set up unattended (kms's own setup_unattended.sh; every secret random, made in this machine)
      when: ws_kms_setup | default(false) | bool
      ansible.builtin.command: bash projectspace/platform/kms/setup_unattended.sh
      args:
        chdir: "{{ ws_dir }}"
      register: kms
      changed_when: "'INITIALISED' in kms.stdout or 'FOUNDATION' in kms.stdout"

    - name: kms — every component's keys (random initial values; the workspace's ccc/scripts/svcmgt/register_all_kms_keys.sh)
      when: ws_kms_setup | default(false) | bool
      ansible.builtin.command: bash ccc/scripts/svcmgt/register_all_kms_keys.sh
      args:
        chdir: "{{ ws_dir }}"
      environment:
        SVC_RUN: "1"
      register: keys
      changed_when: keys.stdout is search('kms keys:.* [1-9][0-9]* created')

    - name: kms — every project signed up (the workspace's ccc/scripts/svcmgt/signup_all_with_kms.sh)
      when: ws_kms_setup | default(false) | bool
      ansible.builtin.command: bash ccc/scripts/svcmgt/signup_all_with_kms.sh
      args:
        chdir: "{{ ws_dir }}"
      environment:
        SVC_RUN: "1"
      register: signups
      changed_when: "'new login' in signups.stdout or 'copied into kms' in signups.stdout"

    - name: the workspace is there (ccc/scripts/svcmgt/svc_policy.conf)
      ansible.builtin.stat:
        path: "{{ ws_dir }}/ccc/scripts/svcmgt/svc_policy.conf"
      register: ws
      failed_when: not ws.stat.exists

    - name: shared values first (inventories/<env>/shared/ — what 2+ projects use)
      ansible.builtin.include_role:
        name: shared
      when: deploy_projects | default([]) | length > 0

    - name: the projects, in start order (inventories/<env>/group_vars/deploy_targets/projects.yml)
      ansible.builtin.include_tasks: tasks/deploy_project.yml
      loop: "{{ deploy_projects | default([]) }}"
      loop_control:
        loop_var: project
        label: "{{ project.name }}"
