# myodoo.yml — deploy myodoo as ONE block (CONFMGT epic [3] config · [7.5] start + dependencies):
#   what it needs first (roles/myodoo/meta/main.yml) → its config from the single source of truth (restart only if changed)
#   → its targets up (projects.yml; none → config only). Each role ONCE, already running → left alone. Again → changed=0.
#   check_playbook.sh → myodoo   dry run: every line that differs — writes nothing, restarts nothing, starts nothing
#   apply_playbook.sh → myodoo   the same, for real
- name: myodoo — deploy (what it needs first)
  hosts: myodoo
  gather_facts: false
  roles:
    - myodoo                       # + what it needs first: roles/myodoo/meta/main.yml (CONFMGT [7.5])
