# myodoo.yml — myodoo's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → myodoo   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → myodoo   writes the changed files, then restarts myodoo with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: myodoo configuration
  hosts: myodoo
  gather_facts: false
  roles:
    - shared                    # inventories/<env>/shared/ first: values used by 2+ projects
    - myodoo
