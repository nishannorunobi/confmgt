# workspace.yml — workspace's configuration from the single source of truth (CONFMGT epic [3]).
#   check_playbook.sh → workspace   dry run: shows every line that differs — writes nothing, restarts nothing
#   apply_playbook.sh → workspace   writes the changed files, then restarts workspace with its OWN scripts — only when
#                                 something really changed (nothing changed → changed=0, no restart)
- name: workspace configuration
  hosts: workspace
  gather_facts: false
  roles:
    - shared                    # inventories/<env>/shared/ first: values used by 2+ projects
    - workspace
