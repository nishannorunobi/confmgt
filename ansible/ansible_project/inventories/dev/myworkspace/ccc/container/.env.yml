# ccc/container/.env — its OWN values on the DEV environment (mirror of ~/myworkspace/ccc/container/.env).
# Values used by 2+ projects are NOT copied here: they point to shared/<topic>.yml · secrets: only kms ADDRESSES.
# Change a value → check_playbook.sh (dry run) shows the line that would change.

mirror:
  PYTHON_IMAGE: "{{ shared_versions.python.image }}:{{ shared_versions.python.tag }}"
  PYTHON_DIGEST: "{{ shared_versions.python.digest }}"
  ANSIBLE_CORE_VERSION: "{{ shared_versions.ansible_core.tag }}"
  AGENT_HOST: "127.0.0.1"
  AGENT_PORT: "{{ shared_ports.ccc_agent }}"
  TZ: "{{ shared_clock.tz }}"                                   # → shared/clock.yml
  LOG_URL: "{{ shared_logging.log_url }}"                # → shared/logging.yml (LOGAN-29)
  WORKSPACE_SOURCE: "mounted,clone"
  WORKSPACE_CLONE_URL: "https://github.com/nishannorunobi/confmgt.git"
  WORKSPACE_CLONE_BRANCH: "main"
  KMS_MASTER_PASSWORD_DIR: "../../mountspace/usb/myworkspace/projectspace/kms/master_password"
