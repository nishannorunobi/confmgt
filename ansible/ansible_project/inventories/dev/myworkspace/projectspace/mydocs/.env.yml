# projectspace/mydocs/.env — its OWN values on the DEV environment (mirror of ~/myworkspace/projectspace/mydocs/.env).
# Values used by 2+ projects are NOT copied here: they point to shared/<topic>.yml · secrets: only kms ADDRESSES.
# Change a value → check_playbook.sh (dry run) shows the line that would change.

mirror:
  KMS_URL: "{{ shared_kms.url_on_host }}"                       # → shared/kms.yml
  SECRET_MGT: "{{ shared_kms.secret_mgt }}"                     # → shared/kms.yml
  PLANE_VERSION: "v1.4.2"
  PLANE_BACKEND_DIGEST: "sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef"
  PLANE_FRONTEND_DIGEST: "sha256:22fd2434fb8d6658439f669ab72f999ce0773abe587663da21a77d70bd63ff61"
  PLANE_ADMIN_DIGEST: "sha256:6e1bb1d800d3c7ce84a09f810d5588db8613b35d4464e722a1bec12556ca0ebb"
  WEB_URL: "http://localhost:8080"
  PLANE_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost"
  APP_BASE_URL: "http://localhost:8080"
  ADMIN_BASE_URL: "http://localhost:8080"
  SPACE_BASE_URL: "http://localhost:8080"
  DEBUG: "0"
  DJANGO_SETTINGS_MODULE: "plane.settings.production"
  SECRET_KEY: "${KMS_URL}/v1/kv/data/mydocs/plane"
  POSTGRES_USER: "{{ shared_postgres.databases.docs.user }}"    # → shared/postgres.yml
  POSTGRES_PASSWORD: "{{ shared_postgres.databases.docs.password }}#{{ shared_postgres.databases.docs.key }}"# → shared/postgres.yml
  POSTGRES_DB: "{{ shared_postgres.databases.docs.db }}"        # → shared/postgres.yml
  POSTGRES_HOST: "{{ shared_postgres.host }}"                   # → shared/postgres.yml
  POSTGRES_PORT: "{{ shared_postgres.port }}"                   # → shared/postgres.yml
  REDIS_HOST: "{{ shared_redis.host }}"                         # → shared/redis.yml
  REDIS_PORT: "{{ shared_redis.port }}"                         # → shared/redis.yml
  REDIS_PASSWORD: "{{ shared_redis.password }}"                 # → shared/redis.yml
  MINIO_ROOT_USER: "plane-minio"
  MINIO_ROOT_PASSWORD: "${KMS_URL}/v1/kv/data/mydocs/plane"
  AWS_S3_ENDPOINT_URL: "http://plane-minio:9000"
  AWS_S3_BUCKET_NAME: "uploads"
  AWS_REGION: "us-east-1"
  USE_MINIO: "1"
  MINIO_ENDPOINT_SSL: "0"
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "1"
  EMAIL_FROM: ""
  ENABLE_SIGNUP: "0"
  ENABLE_EMAIL_PASSWORD: "1"
  ENABLE_MAGIC_LINK_LOGIN: "0"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GITHUB_APP_NAME: ""
  GITLAB_HOST: ""
  GITLAB_CLIENT_ID: ""
  GITLAB_CLIENT_SECRET: ""
  OPENAI_API_KEY: ""
  GPT_ENGINE: ""
  RABBITMQ_HOST: "{{ shared_rabbitmq.host }}"                   # → shared/rabbitmq.yml
  RABBITMQ_PORT: "{{ shared_rabbitmq.amqp_port }}"              # → shared/rabbitmq.yml
  RABBITMQ_USER: "{{ shared_rabbitmq.user }}"                   # → shared/rabbitmq.yml
  RABBITMQ_PASSWORD: "{{ shared_rabbitmq.password }}#{{ shared_rabbitmq.key }}"# → shared/rabbitmq.yml
  RABBITMQ_VHOST: "{{ shared_rabbitmq.vhost }}"                 # → shared/rabbitmq.yml
  KMS_MASTER_PASSWORD_DIR: "../../mountspace/usb/myworkspace/projectspace/kms/master_password"
  TZ: "{{ shared_clock.tz }}"                                   # → shared/clock.yml
