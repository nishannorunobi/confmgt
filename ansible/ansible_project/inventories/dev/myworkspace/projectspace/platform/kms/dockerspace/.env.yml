# projectspace/platform/kms/dockerspace/.env — its OWN values on the DEV environment (mirror of ~/myworkspace/projectspace/platform/kms/dockerspace/.env).
# Values used by 2+ projects are NOT copied here: they point to shared/<topic>.yml · secrets: only kms ADDRESSES.
# Change a value → check_playbook.sh (dry run) shows the line that would change.

mirror:
  OPENBAO_IMAGE: "{{ shared_versions.openbao.image }}:{{ shared_versions.openbao.tag }}@{{ shared_versions.openbao.digest }}"
  KMS_UNSEAL_MODE: "static"
  LOG_URL: "{{ shared_logging.log_url }}"                # → shared/logging.yml (LOGAN-29)
  KMS_STATIC_KEY_DIR: "../../../../mountspace/usb/myworkspace/projectspace/kms/static_key"
  KMS_SHARES_DIR: "../../../../mountspace/usb/myworkspace/projectspace/kms/shares"
  KMS_MASTER_PASSWORD_DIR: "../../../../mountspace/usb/myworkspace/projectspace/kms/master_password"
  KMS_STATIC_KEY_COPY_DIR: ""
  KMS_USB_BACKUP_DIR: ""
