# projectspace/platform/mycache/.env — its values on the DEV environment (mirror of ~/myworkspace/projectspace/platform/mycache/.env; CONFMGT epic [3]).
# Rendered by roles/mycache (templates/myworkspace/… mirrors it too) · secrets: only kms ADDRESSES, never a value.
# Change a value → check_playbook.sh (dry run) shows the line that would change.

mirror:
  REDIS_VERSION: "{{ shared_versions.redis.tag }}"
  REDIS_DIGEST: "{{ shared_versions.redis.digest }}"
  REDIS_HOST: "0.0.0.0"
  REDIS_PORT: "{{ shared_redis.port }}"                   # → shared/redis.yml
  TZ: "{{ shared_clock.tz }}"                             # → shared/clock.yml
  LOG_URL: "{{ shared_logging.log_url }}"                # → shared/logging.yml (LOGAN-29)
  KMS_MASTER_PASSWORD_DIR: "../../../mountspace/usb/myworkspace/projectspace/kms/master_password"
