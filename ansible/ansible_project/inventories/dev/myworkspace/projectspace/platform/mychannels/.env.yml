# projectspace/platform/mychannels/.env — its OWN values on the DEV environment (mirror of ~/myworkspace/projectspace/platform/mychannels/.env).
# Values used by 2+ projects are NOT copied here: they point to shared/<topic>.yml · secrets: only kms ADDRESSES.
# Change a value → check_playbook.sh (dry run) shows the line that would change.

mirror:
  RABBITMQ_VERSION: "{{ shared_versions.rabbitmq.tag }}"
  RABBITMQ_DIGEST: "{{ shared_versions.rabbitmq.digest }}"
  RABBITMQ_AMQP_PORT: "{{ shared_rabbitmq.amqp_port }}"   # → shared/rabbitmq.yml
  RABBITMQ_MGMT_PORT: "{{ shared_rabbitmq.mgmt_port }}"   # → shared/rabbitmq.yml
  RABBITMQ_USER: "{{ shared_rabbitmq.user }}"             # → shared/rabbitmq.yml
  RABBITMQ_VHOST: "{{ shared_rabbitmq.vhost }}"           # → shared/rabbitmq.yml
  TZ: "{{ shared_clock.tz }}"                             # → shared/clock.yml
  LOG_URL: "{{ shared_logging.log_url }}"                # → shared/logging.yml (LOGAN-29)
  KMS_MASTER_PASSWORD_DIR: "../../../mountspace/usb/myworkspace/projectspace/kms/master_password"
