# mycache's values on THIS environment — the single source of truth (CONFMGT epic [3], story 3.1).
# Ansible renders them into projectspace/mycache/.env and cache-agent/agent.conf (roles/mycache/templates/).
# Secrets: only kms ADDRESSES here, never a value. Change a value → check_playbook.sh shows the line that would change.

# → projectspace/mycache/.env
mycache_env:
  REDIS_VERSION: "7-alpine"
  REDIS_DIGEST: "sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7"
  REDIS_HOST: "0.0.0.0"
  REDIS_PORT: "6379"
  TZ: "America/New_York"
  KMS_MASTER_PASSWORD_DIR: "../../mountspace/usb/myworkspace/projectspace/kms/master_password"

# → projectspace/mycache/cache-agent/agent.conf
mycache_agent_conf:
  KMS_URL: "http://kms-openbao:8200"
  SECRET_MGT: "kms"
  PORT: "8892"
  ANTHROPIC_API_KEY: "${KMS_URL}/v1/kv/data/shared/anthropic"
  REDIS_PASSWORD: "${KMS_URL}/v1/kv/data/mycache/redis"
