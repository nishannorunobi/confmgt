# projects.yml — the projects playbooks/deploy.yml brings up on THIS PC, IN START ORDER (CONFMGT [6]; one per story).
#   name     the project (its config role has the same name unless role: says otherwise)
#   targets  its svc_policy.conf targets Ansible starts (ccc/scripts/svcmgt/start_targets.sh) — [] = config only
# Every target here is in ~/myworkspace/ccc/scripts/svcmgt/svc_policy.conf SVC_VIA_DEPLOY too, and only those:
# dockerspace/host_scripts/test_deploy_playbook.sh checks the two lists are the same.
deploy_projects:
  - {name: kms, targets: []}                                                # config only — the bootstrap starts kms (confmgt needs it); a kms restart re-seals it, so never automatic
  - {name: mypostgresql_db, targets: [mypostgresql_db, db-agent]}           # db-agent = its container's entry point (checked)
  - {name: agents, targets: [agent-orchestrator]}                           # the host agents (docker-manager-agent · workspace-agent: start plan default no — not started)
  - {name: workspace_agent, targets: []}                                    # config only — the workspace-agent's MCP config
  - {name: mycache, targets: [mycache]}                                     # cache-agent = its container's entry point
  - {name: mychannels, targets: [mychannels]}                               # channel-agent = its container's entry point
  - {name: mydocs, targets: [mydocs]}                                       # minimal Plane (mydocs-other stays in the start plan, default no)
  - {name: mylog_analytics, targets: []}                                    # config only — not started by default (restart only when it runs)
  - {name: myodoo, targets: []}                                             # config only — not started by default (restart only when it runs)
  - {name: ccc, targets: []}                                                # config only — the bootstrap starts the CCC; it cannot restart itself mid-run
  - {name: workspace, targets: []}                                          # config only — svc_policy.conf, read at every start / stop / status
