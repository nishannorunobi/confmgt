# hosts.yml — how components reach each other INSIDE Docker on this environment's machine (CONFMGT [9.6]).
# One entry per component: its container name on the shared network + the port INSIDE the container (a fact of
# the image — not a published port, so not in ports.yml). base_urls.yml builds the in_docker URLs from it.
shared_hosts:
  network: "my_docker_network"                                  # the shared Docker network every project joins
  kms:      { name: "kms-openbao",               port: "8200" }
  minio:    { name: "plane-minio",               port: "9000" }
  loki:     { name: "mylog_analytics-container", port: "3100" }
  redis:    { name: "mycache-redis",             port: "6379" }
  rabbitmq: { name: "mychannels-rabbitmq",       port: "5672" }
  postgres: { name: "mypostgresql_db-container", port: "5432" }
