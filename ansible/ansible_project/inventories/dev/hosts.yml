# hosts.yml — the machines of the DEV environment (the developer PC). How to reach each one: host_vars/<machine>.yml.
# A project's group lists the machines it runs on: a new project = one more group here + group_vars/<project>/.
all:
  children:
    mycache:
      hosts:
        dev-pc:
    mychannels:
      hosts:
        dev-pc:
    mypostgresql_db:
      hosts:
        dev-pc:
    mydocs:
      hosts:
        dev-pc:
    mylog_analytics:
      hosts:
        dev-pc:
    myodoo:
      hosts:
        dev-pc:
    agents:
      hosts:
        dev-pc:
    workspace_agent:
      hosts:
        dev-pc:
    workspace:
      hosts:
        dev-pc:
    kms:
      hosts:
        dev-pc:
    confmgt:
      hosts:
        dev-pc:
    deploy_targets:             # playbooks/deploy.yml (CONFMGT [6]) — on this PC: no git, no Docker install (group_vars/deploy_targets/)
      hosts:
        dev-pc:
