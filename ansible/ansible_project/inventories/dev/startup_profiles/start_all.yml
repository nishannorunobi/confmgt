# start_all.yml — the startup profile "start_all": every project of deploy_targets/projects.yml except myodoo (CONFMGT [7.4]).
# Run by ccc/startup/startup_start_all.sh (ccc/startup/startup.sh runs basic.yml). The engine starts first, whatever the profile.
# A project with targets: [] in projects.yml (kms · workspace_agent · mylog_analytics · ccc · workspace) only gets its config —
# listing it here starts nothing. A new project of projects.yml → add its name here too (typed on purpose, owner 2026-11-27).
profile_projects:
  - kms
  - mypostgresql_db
  - agents
  - workspace_agent
  - mycache
  - mychannels
  - mydocs
  - mylog_analytics
  - ccc
  - workspace
