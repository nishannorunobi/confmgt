# shared/rabbitmq.yml — RabbitMQ (mychannels) as every project reaches it on the TEST environment (the test VM).
# Owned by mychannels (servers first: the server defines its connection; clients like Plane only refer to it).
shared_rabbitmq:
  host: "mychannels-rabbitmq"                # its name on my_docker_network
  amqp_port: "{{ shared_ports.rabbitmq_amqp }}"
  mgmt_port: "{{ shared_ports.rabbitmq_mgmt }}"
  user: "admin"
  vhost: "/"
  password: "${KMS_URL}/v1/kv/data/mychannels/rabbitmq"        # a kms ADDRESS, never the password
  key: "RABBITMQ_PASS"                         # the key inside that kms entry
