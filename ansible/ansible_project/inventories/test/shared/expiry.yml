# shared/expiry.yml — the early warning for expiring credentials, the same for every project on the TEST environment
# (CONFMGT [8]). Projects refer to it by name ({{ shared_expiry.… }}) in their expiry/expiry.conf mirror — never a copy.
# The RULE lives here (configuration); each credential's DATE lives in its source (kms, Plane, …) and is read, never stored.
shared_expiry:
  # a credential expiring within this many days is shown at the project's start / stop (⚠ + what to do now);
  # until then nothing is printed · a project with a different window writes its own number in its mirror instead
  warn_before_days: 7
  # the rotation rule (KMS-79): a password a project ISSUES (its issued_credentials/) gets a new value this many days
  # after its last change — a reminder only, nothing stops · the date is kms's own (the entry's last write), never stored
  rotate_after_days: 90

  # every key, with a DECISION (CONFMGT [8.7]) — none is silent by accident. kind:
  #   expires — dies on a date; its own expiry check warns (the date is read from the source, never stored)
  #   rotate  — never dies, gets a new value every rotate_after_days (the date = kms's own last write)
  #   never   — stays until the owner decides, ON PURPOSE (the reason says why)
  # where: kv/<entry> = a kms entry (secret_age.sh at startup warns about any kms entry NOT on this list) ·
  #        login/<role> = a kms login · file:<path> / owner: = outside kms (listed + counted, nothing read)
  # a new key = one line in key_list, then its check / rotate script if it needs one
  key_list:
    # 🔑 rotate — the projects' own passwords (the issuing project rotates: [8.6] pattern, [8.14] the rotation day)
    - { where: kv/mypostgresql_db/postgres,  kind: rotate,  reason: "database admin" }
    - { where: kv/mypostgresql_db/mydocsdb,  kind: rotate,  reason: "Plane's database user" }
    - { where: kv/mypostgresql_db/myodoo,    kind: rotate,  reason: "Odoo's database user" }
    - { where: kv/mypostgresql_db/umsdb,     kind: rotate,  reason: "the agents' database user" }
    - { where: kv/mypostgresql_db/grafana,   kind: rotate,  reason: "Grafana's database user" }
    - { where: kv/mycache/redis,             kind: rotate,  reason: "Redis password (reminder: [8.6])" }
    - { where: kv/mychannels/rabbitmq,       kind: rotate,  reason: "RabbitMQ password" }
    - { where: kv/mydocs/plane,              kind: rotate,  reason: "Plane's own secret" }
    - { where: kv/myodoo/odoo,               kind: rotate,  reason: "Odoo admin password" }
    - { where: kv/agents/shared,             kind: rotate,  reason: "Gmail SMTP app password (reminder: [8.12])" }
    - { where: kv/ccc/agent/owner,           kind: rotate,  reason: "CCC caller secret (owner)" }
    - { where: kv/ccc/agent/svcmgt,          kind: rotate,  reason: "CCC caller secret (svcmgt)" }
    - { where: kv/ccc/agent/test_server,     kind: rotate,  reason: "CCC caller secret (test server)" }
    - { where: kv/confmgt/ansible,           kind: rotate,  reason: "Ansible SSH key" }
    # 🎫 expires — each has (or gets) its own expiry check
    - { where: kv/workspace/mcp,             kind: expires, reason: "Plane API token (check: agents/workspace-agent/expiry)" }
    - { where: login/ccc-agent,              kind: expires, reason: "kms login, 32 days (check: ccc/agent/expiry)" }
    - { where: login/agents-host,            kind: expires, reason: "kms login, 32 days (check: agents/used_credentials)" }
    - { where: login/workspace-host,         kind: expires, reason: "kms login, 32 days (check: agents/workspace-agent/expiry)" }
    - { where: login/log-agent,              kind: expires, reason: "kms login (check: mylog_analytics log-agent/expiry)" }
    - { where: login/mydocs-plane,           kind: expires, reason: "kms login (check: mydocs/expiry)" }
    - { where: login/myodoo-odoo,            kind: expires, reason: "kms login (check: myodoo odoo-agent/expiry)" }
    - { where: login/kms-age,                kind: expires, reason: "kms login (check: kms/expiry)" }
    - { where: login/mypostgresql_db-db-agent,  kind: expires, reason: "kms login, 8760h ≈ 2027-10 — no check yet: [8.13]" }
    - { where: login/mycache-cache-agent,       kind: expires, reason: "kms login, 8760h ≈ 2027-10 — no check yet: [8.13]" }
    - { where: login/mychannels-channel-agent,  kind: expires, reason: "kms login, 8760h ≈ 2027-10 — no check yet: [8.13]" }
    - { where: login/kms-backup,                kind: expires, reason: "kms login, lifetime not readable yet — [8.13] reads it" }
    # ⚪ never — on purpose
    - { where: kv/shared/anthropic,          kind: never,   reason: "Anthropic API key — Anthropic issues it; a new one only when it leaks or Anthropic revokes it" }
    - { where: "file:mountspace/usb/myworkspace/projectspace/kms/static_key/static_unseal.key", kind: never, reason: "kms unseal key — a new one = re-key kms (a planned event, never a routine)" }
    - { where: "owner:kms unseal shares (2)",    kind: never, reason: "only the owner holds them — re-key kms to change" }
    - { where: "file:kms master_password",       kind: never, reason: "kms owner password — changed by the owner by hand" }
    - { where: "file:portainer.key",             kind: never, reason: "Portainer's own key — changes only with a Portainer reinstall" }
