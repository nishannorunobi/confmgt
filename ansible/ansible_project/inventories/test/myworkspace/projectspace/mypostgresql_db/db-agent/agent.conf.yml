# projectspace/mypostgresql_db/db-agent/agent.conf — its OWN values on the TEST environment (the test VM) (mirror of ~/myworkspace/projectspace/mypostgresql_db/db-agent/agent.conf).
# Values used by 2+ projects are NOT copied here: they point to shared/<topic>.yml · secrets: only kms ADDRESSES.
# Change a value → check_playbook.sh (dry run) shows the line that would change.

mirror:
  KMS_URL: "{{ shared_kms.url_in_containers }}"                 # → shared/kms.yml
  SECRET_MGT: "{{ shared_kms.secret_mgt }}"                     # → shared/kms.yml
  PORT: "8890"
  PG_PORT: "{{ shared_postgres.port }}"                         # → shared/postgres.yml
  PGDATA: "/var/lib/postgresql/data"
  POSTGRES_PASSWORD: "${KMS_URL}/v1/kv/data/mypostgresql_db/postgres"
  DOCS_USER: "{{ shared_postgres.databases.docs.user }}"        # → shared/postgres.yml
  DOCS_DB: "{{ shared_postgres.databases.docs.db }}"            # → shared/postgres.yml
  DOCS_PASSWORD: "{{ shared_postgres.databases.docs.password }}"# → shared/postgres.yml
  UMS_USER: "{{ shared_postgres.databases.ums.user }}"          # → shared/postgres.yml
  UMS_DB: "{{ shared_postgres.databases.ums.db }}"              # → shared/postgres.yml
  UMS_PASSWORD: "{{ shared_postgres.databases.ums.password }}"  # → shared/postgres.yml
  ODOO_USER: "{{ shared_postgres.databases.odoo.user }}"        # → shared/postgres.yml
  ODOO_DB: "{{ shared_postgres.databases.odoo.db }}"            # → shared/postgres.yml
  ODOO_PASSWORD: "{{ shared_postgres.databases.odoo.password }}"# → shared/postgres.yml
  GRAFANA_USER: "{{ shared_postgres.databases.grafana.user }}"  # → shared/postgres.yml
  GRAFANA_DB: "{{ shared_postgres.databases.grafana.db }}"      # → shared/postgres.yml
  GRAFANA_PASSWORD: "{{ shared_postgres.databases.grafana.password }}"# → shared/postgres.yml
  ANTHROPIC_API_KEY: "{{ shared_anthropic.api_key }}"           # → shared/anthropic.yml
