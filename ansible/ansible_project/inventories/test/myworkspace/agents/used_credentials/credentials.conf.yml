# agents/used_credentials/credentials.conf — its OWN values on the TEST environment
# (mirror of ~/myworkspace/agents/used_credentials/credentials.conf).
# Values used by 2+ projects are NOT copied here: they point to shared/<topic>.yml.

mirror:
  WARN_BEFORE_DAYS: "{{ shared_expiry.warn_before_days }}"   # → shared/expiry.yml (a different window for this project: a number here)
  ROTATE_AFTER_DAYS: "{{ shared_expiry.rotate_after_days }}"   # → shared/expiry.yml (a different rule for this project: a number here)
