# workspace.yml — WHICH workspace playbooks/deploy.yml puts on the deploy_targets, and where (one topic per file).
# GitHub reaches the machine with its own key (the test VM: test_server/deploy_test_vm.sh gives it one).
ws_manage_git: true        # clone / pull ws_branch (a fresh machine)
ws_base_packages: [git, curl, python3-venv]   # a fresh Ubuntu lacks python3-venv (the host agents build their venv)
ws_manage_docker: true     # install Docker with the workspace's own script when missing
ws_kms_setup: true         # the VM's OWN kms, unattended — random secrets made in the VM (CONFMGT [6.17])
ws_repo: git@github.com:nishannorunobi/myworkspace.git
ws_branch: main            # the default — test_server/deploy_test_vm.sh sends the story branch it runs from (extra_vars)
ws_dir: "/home/{{ ansible_user }}/myworkspace"
# the project repos the VM needs (each project lives in its own repo under projectspace/) — cloned, or pulled
# (local changes in the VM → refused, never thrown away). branch: not set → main.
ws_project_repos:
  - {path: projectspace/kms, repo: "git@github.com:nishannorunobi/kms.git"}
  - {path: projectspace/mypostgresql_db, repo: "git@github.com:nishannorunobi/mypostgresql_db.git"}
  - {path: projectspace/mycache, repo: "git@github.com:nishannorunobi/mycache.git"}
  - {path: projectspace/mychannels, repo: "git@github.com:nishannorunobi/mychannels.git"}
  - {path: projectspace/mydocs, repo: "git@github.com:nishannorunobi/mydocs.git"}
  - {path: projectspace/mylog_analytics, repo: "git@github.com:nishannorunobi/mylog_analytics.git"}
  - {path: projectspace/myodoo, repo: "git@github.com:nishannorunobi/myodoo.git"}
  - {path: projectspace/confmgt, repo: "git@github.com:nishannorunobi/confmgt.git"}
