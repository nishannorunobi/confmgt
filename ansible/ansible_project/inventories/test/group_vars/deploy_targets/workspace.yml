# workspace.yml — WHICH workspace playbooks/deploy.yml puts on the deploy_targets, and where (one topic per file).
# GitHub reaches the machine with its own key (the test VM: test_server/05_deploy_test_vm.sh gives it one).
ws_manage_git: true        # clone / pull ws_branch (a fresh machine)
ws_base_packages: [git, curl, python3-venv]   # a fresh Ubuntu lacks python3-venv (the host agents build their venv)
ws_manage_docker: true     # install Docker with the workspace's own script when missing
ws_kms_setup: true         # the VM's OWN kms, unattended — random secrets made in the VM (CONFMGT [6.17])
ws_repo: git@github.com:nishannorunobi/myworkspace.git
ws_branch: main            # the default — test_server/05_deploy_test_vm.sh sends the story branch it runs from (extra_vars)
ws_dir: "/home/{{ ansible_user }}/myworkspace"
# the project repos the VM needs: NOT listed here — playbooks/deploy.yml reads the deploy=yes lines of the workspace's
# ccc/scripts/gitmgt/repos.conf (THE list, CLAUDEWORK-258) and clones / pulls them (local changes → refused). branch → main
# unless 05_deploy_test_vm.sh sends the PC's (ws_repo_branches).
