# hosts.yml — the machines of the TEST environment. How to reach each one: host_vars/<machine>.yml.
# A new machine = one line here + its host_vars file. A new environment = a new folder next to test/ (e.g. staging/).
# deploy_targets — the machines playbooks/deploy.yml puts the workspace on (CONFMGT [6]). The dev inventory has NO
# such group, so deploy.yml can never touch the developer PC. What to deploy: group_vars/deploy_targets/.
all:
  hosts:
    test-vm:
  children:
    deploy_targets:
      hosts:
        test-vm:
