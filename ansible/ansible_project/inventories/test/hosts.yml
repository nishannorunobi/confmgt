# hosts.yml — the machines of the TEST environment. How to reach each one: host_vars/<machine>.yml.
# A new machine = one line here + its host_vars file. A new environment = a new folder next to test/ (e.g. staging/).
# deploy_targets — the machines playbooks/deploy.yml puts the workspace on (CONFMGT [6]). What to deploy and how:
# group_vars/deploy_targets/ (here: git + Docker managed; the dev inventory switches both off for your PC).
all:
  hosts:
    test-vm:
  children:
    deploy_targets:
      hosts:
        test-vm:
