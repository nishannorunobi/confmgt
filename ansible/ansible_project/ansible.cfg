# ansible.cfg — the Ansible project's settings (confmgt: ccc/infra/ansible/ansible_project). Plain Ansible: it runs the same
# inside THE CCC container (its agent's deploy ability uses it) and on any PC with ansible-core installed.
[defaults]
inventory = inventories/dev
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
forks = 10
timeout = 20

[ssh_connection]
pipelining = True
