# confmgt/ansible/dockerspace/docker-compose.yml — the Ansible container (relative paths = from this dockerspace/ folder;
# compose project name below: its volume is confmgt-ansible_confmgt-ansible-data)
name: confmgt-ansible

# ── Container logs capped (CLAUDEWORK-4): json-file logs otherwise grow without bound in /var/lib/docker ──
x-logging: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  # ── Ansible (confmgt) ─────────────────────────────────────────────────────────
  ansible:
    logging: *logs
    # confmgt's own image = Python + pinned ansible-core + the ssh client (dockerspace/Dockerfile) — built once, then offline
    build:
      context: ..                    # the project folder (confmgt/ansible) — only ansible-agent/requirements.txt is sent
      dockerfile: dockerspace/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
        PYTHON_DIGEST: ${PYTHON_DIGEST}
        ANSIBLE_CORE_VERSION: ${ANSIBLE_CORE_VERSION}
    image: confmgt-ansible:${ANSIBLE_CORE_VERSION}
    container_name: confmgt-ansible
    restart: unless-stopped        # kms sealed at start → it stops, then retries by itself
    # The ansible-agent is the entry point — Ansible's assistant: it gets ANSIBLE_SSH_KEY_SECRET from kms (its own
    # login), turns it into the SSH key in RAM (/run/ansible-ssh, never on disk), and serves its API: check / apply a
    # playbook from ansible_project/, the public key, the last run. Ansible itself runs only when asked.
    command: ["/opt/venv/bin/python", "/ansible-agent/supervisor.py"]
    tmpfs:
      - /run
    ports:
      - "${AGENT_HOST}:${AGENT_PORT}:8897"
    env_file: .env                 # settings only (no secret — the SSH key's kms address is in ansible-agent/agent.conf)
    environment:
      LOG_MIRROR_ROOT: /mountspace/logs/myworkspace/projectspace/confmgt/ansible
      KMS_MASTER_PASSWORD_FILE: /mountspace/usb/myworkspace/projectspace/kms/master_password/master_password
      ANSIBLE_PROJECT_DIR: /ansible_project
      ANSIBLE_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"          # the agent's output reaches docker logs at once
      PYTHONDONTWRITEBYTECODE: "1"   # no root-owned __pycache__ in the mounted ansible-agent/ folder
    volumes:
      - confmgt-ansible-data:/data                        # known_hosts (trust on first use) + the last runs
      - ../ansible-agent:/ansible-agent                    # the agent + its kms login (connect_external/kms/credentials/)
      - ./container_scripts:/container_scripts:ro          # checks you run inside: bash /container_scripts/env_check.sh
      - ../ansible_project:/ansible_project:ro             # the Ansible project: inventories, playbooks, roles — read-only
      - ${LOG_DIR:-../../../../mountspace/logs}:/mountspace/logs   # LOG_DIR in .env — another machine sets its own
      # kms's master_password folder ONLY, read-only: no kms login yet → the ansible-agent signs itself up from it.
      # The owner keeps it empty most of the time. Where it is: KMS_MASTER_PASSWORD_DIR in .env
      - ${KMS_MASTER_PASSWORD_DIR}:/mountspace/usb/myworkspace/projectspace/kms/master_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"              # the PC itself (e.g. the test VM's forwarded SSH port)
    networks:
      my_docker_network:
        ipv4_address: 172.28.0.100     # static IP within my_docker_network's subnet
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8897/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  confmgt-ansible-data:

networks:
  my_docker_network:
    external: true
